version: 2

models:

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_factory
    columns:
      - name: factory_id
        tests:
          - unique
          - not_null

  - name: dim_machine
    columns:
      - name: machine_id
        tests:
          - unique
          - not_null

      - name: factory_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_factory')
              field: factory_id

  - name: fct_manufacturing
    columns:
      - name: production_id
        tests:
          - unique
          - not_null

      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: machine_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_machine')
              field: machine_id

      - name: factory_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_factory')
              field: factory_id